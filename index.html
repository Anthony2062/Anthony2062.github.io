<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBCO INDUSTRIES (TM) TERMLINK</title>
    <style>
        body {
            background-color: #0d120d;
            color: #1aff80; /* Verde Terminal */
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .terminal {
            width: 600px;
            padding: 20px;
            border: 3px solid #1aff80;
            box-shadow: 0 0 20px rgba(26, 255, 128, 0.2);
            background: rgba(0, 0, 0, 0.8);
            position: relative;
        }

        /* Efeito de Scanline */
        .terminal::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        h2 { text-align: center; border-bottom: 2px solid #1aff80; padding-bottom: 10px; }

        label { display: block; margin-top: 15px; font-weight: bold; }
        
        input, select {
            width: 100%;
            background: transparent;
            border: 1px solid #1aff80;
            color: #1aff80;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus { background: #1aff80; color: #000; }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            background: #1aff80;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 1.1rem;
        }

        button:hover { background: #15cc66; box-shadow: 0 0 15px #1aff80; }
    </style>
</head>
<body>

    <div class="terminal">
        <h2>BEM-VINDO AO NEW VEGAS</h2>
        <p>IDENTIFICAÇÃO DE USUÁRIO NECESSÁRIA</p>

        <form action="index.html"> <label for="nome">CODENAME DO MENSAGEIRO:</label>
            <input type="text" id="nome" placeholder="Ex: Courier Six" required>

            <label for="faccao">ESCOLHA SUA LEALDADE:</label>
            <select id="faccao" onchange="atualizarCargos()">
                <option value="ncr">New California Republic (NCR)</option>
                <option value="legion">Caesar's Legion</option>
                <option value="bos">Brotherhood of Steel</option>
                <option value="house">Mr. House / The Strip</option>
                <option value="followers">Followers of the Apocalypse</option>
            </select>

            <label for="cargo">CARGO / PATENTE:</label>
            <select id="cargo">
                </select>

            <label for="pipboy">NÚMERO DE SÉRIE DO PIP-BOY:</label>
            <input type="text" placeholder="3000-MK-IV" required>

            <a href="inicial.html"><button type="button">INICIAR SISTEMA [ENTER]</button></a>
        </form>
    </div>

    <script>
        const cargos = {
            ncr: ["Recruta", "Ranger", "Primeiro Reconhecimento", "General"],
            legion: ["Escravo", "Recruta", "Decanus", "Centurião", "Legado"],
            bos: ["Iniciado", "Escriba", "Cavaleiro", "Paladino", "Sentinela"],
            house: ["Cidadão", "Securitron Mk I", "Securitron Mk II", "Gerente do Lucky 38"],
            followers: ["Assistente", "Médico", "Pesquisador", "Administrador"]
        };

        function atualizarCargos() {
            const faccaoSelect = document.getElementById("faccao");
            const cargoSelect = document.getElementById("cargo");
            const faccaoSelecionada = faccaoSelect.value;
            
            // Limpa opções anteriores
            cargoSelect.innerHTML = "";

            // Adiciona novas opções
            cargos[faccaoSelecionada].forEach(cargo => {
                let option = document.createElement("option");
                option.text = cargo;
                option.value = cargo;
                cargoSelect.add(option);
            });
        }

        // Inicializa com a primeira opção (NCR)
        window.onload = atualizarCargos;
    </script>
</body>
</html>
